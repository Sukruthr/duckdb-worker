apiVersion: batch/v1
kind: Job
metadata:
  name: duckdb-worker-example
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: your-registry/duckdb-worker:example
          args:
            - --memory-limit=4GB
            - --threads=2
            - --temp-directory=/spill
            - --max-temp-size=50GB
            - --output=/results/result.parquet
            - --profile=/results/profile.json
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 60Gi
            limits:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 60Gi
          volumeMounts:
            - name: spill
              mountPath: /spill
            - name: results
              mountPath: /results
      volumes:
        - name: spill
          emptyDir:
            sizeLimit: 50Gi
        - name: results
          persistentVolumeClaim:
            claimName: duckdb-worker-results
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: duckdb-worker-results
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
